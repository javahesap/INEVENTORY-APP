# --- DB (MySQL 8 / Hikari) ---
spring.datasource.url=jdbc:mysql://localhost:3306/inventorydb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=SERVER&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari havuz ayarlar\u0131 (lokal için makul de\u011Ferler)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update              
spring.jpa.show-sql=true                          
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# (opsiyonel küçük optimizasyonlar)
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=50

# MVC (Boot 3'te varsay\u0131lan PathPatternParser; sadece gerekliyse aç)
# spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# CORS (geli\u015Ftirme için geni\u015F)
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.allow-credentials=false

# JWT (DEV: sabit; PROD: env'den al!)
app.jwt.secret=ChangeThisSuperSecretKey_AtLeast32CharsLong
app.jwt.expiration-ms=86400000

# Script dosyalar\u0131 kullan\u0131yorsan
spring.sql.init.encoding=UTF-8
