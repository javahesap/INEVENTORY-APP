# --- DB ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari (prod)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000

# JPA/Hibernate (\u015Fema Flyway taraf\u0131ndan yönetilecek)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# \u0130stersen sabitle:
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Flyway (schema yönetimi)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true   # mevcut tablolar varsa ilk migrasyonla baseline al

# CORS (prod)
app.cors.allowed-origins=https://example.com,https://app.example.com
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.allow-credentials=true

# JWT (prod: env\u2019den gelir)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
